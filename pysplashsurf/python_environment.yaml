# I recommend installing as a subdirectory:
# conda env create --prefix ./envs -f python_environment.yaml
# Then activate using: conda activate ./envs
name: pysplashsurf
channels:
  - conda-forge
dependencies:
  - maturin=1.13.3
  - patchelf
  - meshio=5.3.5
  - numpy=2.4.6
  - pip=26.1
  - python=3.13.2
  - python_abi=3.13
  - numpydoc=1.10.0
  - trimesh=4.12.2
  - rtree=1.4.1
  - scipy=1.17.1
  - pytest=9.0.3
  - pytest-md=0.2.0

  - sphinx=9.1.0
#  - sphinx_rtd_theme=3.1.0
  - sphinx-autodoc-typehints==3.10.4
  - myst-parser=5.1.0
  - numpydoc==1.10.0
  - pip:
    - sphinx_rtd_theme==3.1.0  # The 3.1.0 release of sphinx_rtd_theme on conda-forge is broken, see: https://github.com/conda-forge/sphinx_rtd_theme-feedstock/issues/40